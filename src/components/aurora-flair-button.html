<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Flair Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --bg: #08080d;
    --ink: #eceaf5;
    --ink-dim: #8a879c;
    --violet: #8b6bff;
    --cyan: #35e6c9;
    --magenta: #ff4fa3;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(139,107,255,0.08), transparent 55%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .button {
    --r: 6.25rem;
    align-items: center;
    background: rgba(255,255,255,0.02);
    border: 1.5px solid rgba(255,255,255,0.16);
    border-radius: var(--r);
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    justify-content: center;
    overflow: hidden;
    padding: 1.1rem 2.2rem;
    position: relative;
    text-decoration: none;
    backdrop-filter: blur(2px);
  }

  .button__label{
    position: relative;
    z-index: 2;
    display: inline-flex;
    gap: 0.05em;
    pointer-events: none;
  }

  .button__label .char{
    display: inline-block;
    will-change: transform;
  }

  .button__flair{
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    transform: scale(0);
    transform-origin: 0 0;
    filter: blur(18px) saturate(1.3);
    mix-blend-mode: screen;
  }

  .button__flair .orb{
    position: absolute;
    top: 0; left: 0;
    width: 62%;
    aspect-ratio: 1/1;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .orb--a{ background: var(--violet); width: 85%; }
  .orb--b{ background: var(--cyan); width: 60%; transform: translate(-65%, -35%); }
  .orb--c{ background: var(--magenta); width: 55%; transform: translate(-30%, -65%); }

  .button:hover .button__label{ color: #fff; }

  footer{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 8px;
  }
</style>
</head>
<body>

  <div class="eyebrow">aurora flair · cursor-tracked reveal</div>

  <a href="#" class="button" data-block="button">
    <span class="button__flair">
      <span class="orb orb--a"></span>
      <span class="orb orb--b"></span>
      <span class="orb orb--c"></span>
    </span>
    <span class="button__label"></span>
  </a>

  <footer>enter / exit position drives the blob origin — same idea as GreenSock's flair demo, different material</footer>

<script>
// letterize the label
const label = document.querySelector('.button__label');
"Get GSAP".split('').forEach(ch => {
  const span = document.createElement('span');
  span.className = 'char';
  span.textContent = ch === ' ' ? '\u00A0' : ch;
  label.appendChild(span);
});

class AuroraButton {
  constructor(el){
    this.el = el;
    this.flair = el.querySelector('.button__flair');
    this.chars = el.querySelectorAll('.char');

    this.xSet = gsap.quickSetter(this.flair, "xPercent");
    this.ySet = gsap.quickSetter(this.flair, "yPercent");

    this.el.addEventListener('mouseenter', (e) => this.onEnter(e));
    this.el.addEventListener('mouseleave', (e) => this.onLeave(e));
    this.el.addEventListener('mousemove', (e) => this.onMove(e));
  }

  getXY(e){
    const { left, top, width, height } = this.el.getBoundingClientRect();
    const xT = gsap.utils.pipe(gsap.utils.mapRange(0, width, 0, 100), gsap.utils.clamp(0, 100));
    const yT = gsap.utils.pipe(gsap.utils.mapRange(0, height, 0, 100), gsap.utils.clamp(0, 100));
    return { x: xT(e.clientX - left), y: yT(e.clientY - top) };
  }

  onEnter(e){
    const { x, y } = this.getXY(e);
    this.xSet(x);
    this.ySet(y);
    gsap.to(this.flair, { scale: 1, duration: 0.5, ease: "power2.out" });
  }

  onLeave(e){
    const { x, y } = this.getXY(e);
    gsap.killTweensOf(this.flair);
    gsap.to(this.flair, {
      xPercent: x > 90 ? x + 20 : x < 10 ? x - 20 : x,
      yPercent: y > 90 ? y + 20 : y < 10 ? y - 20 : y,
      scale: 0,
      duration: 0.35,
      ease: "power2.out"
    });
    gsap.to(this.chars, { x: 0, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)", stagger: 0.01 });
  }

  onMove(e){
    const { x, y } = this.getXY(e);
    gsap.to(this.flair, { xPercent: x, yPercent: y, duration: 0.45, ease: "power2" });

    // subtle magnetic parallax on each letter, based on distance from cursor
    const rect = this.el.getBoundingClientRect();
    this.chars.forEach(char => {
      const cr = char.getBoundingClientRect();
      const cx = cr.left + cr.width / 2 - rect.left;
      const cy = cr.top + cr.height / 2 - rect.top;
      const relX = (e.clientX - rect.left) - cx;
      const relY = (e.clientY - rect.top) - cy;
      const dist = Math.hypot(relX, relY);
      const pull = gsap.utils.clamp(0, 1, 1 - dist / 140);
      gsap.to(char, {
        x: -relX * 0.12 * pull,
        y: -relY * 0.12 * pull,
        duration: 0.4,
        ease: "power2.out"
      });
    });
  }
}

document.querySelectorAll('[data-block="button"]').forEach(el => new AuroraButton(el));
</script>

</body>
</html>
